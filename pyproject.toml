[project]
name = "soki"
version = "0.1.0"
description = "A sales CRM that runs on your own machine, on your own model key: it judges who to meet, writes the note, and keeps your LinkedIn account safe."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
soki = "soki.cli:main"

[project.optional-dependencies]
chromium = ["playwright>=1.40"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soki"]
